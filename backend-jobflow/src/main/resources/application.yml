spring:
  application:
    name: jobflow-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobflow}
    username: ${DATABASE_USERNAME:jobflow_user}
    password: ${DATABASE_PASSWORD:change_me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always

jobflow:
  jwt:
    secret: ${JWT_SECRET:dev_only_secret_change_me_dev_only_secret_change_me}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.jobflow: INFO
